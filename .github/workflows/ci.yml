name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Smart-AI-FINAL-V6.1.1-PKG

    steps:
      - name: Check out source and LFS models
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS objects are available
        run: git lfs pull

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Smart-AI-FINAL-V6.1.1-PKG/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Download and verify neural speaker model
        run: |
          npm run speaker:download-model
          npm run speaker:verify-model

      - name: Build production bundles
        run: npm run build

      - name: Build production container
        run: docker build --tag smart-expert-enterprise:ci .